name: wiseonline

services:
  postgres:
    image: postgres:16-alpine
    container_name: wiseonline-postgres
    restart: unless-stopped
    environment:
      # Bootstrap superuser (official postgres image). Local dev only.
      POSTGRES_DB: ${POSTGRES_DB:-wiseonline}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
      # Consumed by docker/postgres/init/01-roles.sh to provision the
      # `migrator` / `app_user` roles (PRD §5 Layer 3). Local dev only —
      # override via a root .env for anything beyond a throwaway machine.
      # No default: compose refuses to start unless these are set (copy
      # .env.example to .env). Stops the stack from silently coming up with
      # repo-published passwords on a shared/staging host.
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD (cp .env.example .env)}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?set APP_USER_PASSWORD (cp .env.example .env)}
    ports:
      # Bind to loopback only. Docker's port publishing bypasses host
      # firewalls (ufw/firewalld) via DNAT, so a 0.0.0.0 bind would expose the
      # dev DB — with the known dev passwords — to the local network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: wiseonline_postgres_data
